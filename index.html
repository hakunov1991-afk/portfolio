.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);transition:all .2s}
.tab small{display:none}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tab:hover{color:var(--text);border-color:#3a4258}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected=true] .dot{background:var(--accent-ink)}
.panel{padding:18px 20px 48px;max-width:900px}
.foot{display:none}
@media (min-width:960px){
  body{padding-bottom:0;padding-left:320px}
  .side{position:fixed;left:0;top:0;bottom:0;width:320px;padding:32px 24px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
  .tabs{position:static;flex-direction:column;overflow:visible;padding:0;background:none;backdrop-filter:none;border:0;gap:8px}
  .tab{border-radius:var(--r);padding:12px 14px;flex-direction:row;justify-content:space-between;align-items:center;white-space:normal;text-align:left}
  .tab .tx{display:flex;flex-direction:column;gap:2px}
  .tab small{display:block;font-family:var(--font-m);font-size:11px;font-weight:400;opacity:.75}
  .panel{padding:56px 56px 80px}
  .foot{display:block;margin-top:auto;font-size:12px;color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none}
}

<script>
(function () {
  var D = window.DATA;
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var ext = '<svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

  function aboutPanel() {
    var m = D.me;
    var h = '<header class="hero">';
    h += '<p class="eyebrow">Обо мне</p>';
    h += '<h1 class="name">' + esc(m.name) + '</h1>';
    h += '<p class="role">' + esc(m.role) + '</p>';
    h += '<p class="summary">' + esc(m.summary) + '</p>';
    h += '<div class="contacts">' + m.contacts.map(function (c) {
      return c.href ? '<a class="chip" href="' + c.href + '"' + (c.href.indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '') + '>' + esc(c.label) + '</a>' : '<span class="chip">' + esc(c.label) + '</span>';
    }).join('') + '</div>';
    h += '<dl class="stats">' + m.stats.map(function (s) {
      return '<div class="stat"><dt>' + esc(s.l) + '</dt><dd>' + esc(s.n) + '</dd></div>';
    }).join('') + '</dl></header>';

    h += '<section class="block"><h2 class="h">Чем работаю</h2><div class="skills">' + m.skills.map(function (g) {
      return '<div class="sk"><h3>' + esc(g.t) + '</h3><div class="tags">' + g.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div></div>';
    }).join('') + '</div></section>';

    h += '<section class="block"><h2 class="h">Образование и сертификаты</h2><div class="edu">' + m.edu.map(function (e) {
      return '<div class="edu-i"><span class="yr">' + e.y + '</span><div><h3>' + esc(e.t) + '</h3><p>' + esc(e.s) + '</p></div></div>';
    }).join('') + '</div><ul class="certs">' + m.certs.map(function (c) {
      return '<li><a href="' + c.href + '" target="_blank" rel="noopener">' + esc(c.t) + ext + '</a></li>';
    }).join('') + '</ul></section>';

    h += '<section class="block"><h2 class="h">Преимущества</h2><div class="facts">' + m.adv.map(function (a) {
      return '<div class="fact"><h3>' + esc(a.t) + '</h3><p>' + esc(a.p) + '</p></div>';
    }).join('') + '</div></section>';

    h += '<section class="block"><h2 class="h">Как я работаю</h2><div class="facts">' + m.how.map(function (a, i) {
      return '<div class="fact"><h3>Шаг ' + (i + 1) + '. ' + esc(a.t) + '</h3><p>' + esc(a.p) + '</p></div>';
    }).join('') + '</div></section>';

    h += '<section class="block"><h2 class="h">Формат и условия</h2><div class="facts">' + m.about.map(function (a) {
      return '<div class="fact"><h3>' + esc(a.t) + '</h3><p>' + esc(a.p) + '</p></div>';
    }).join('') + '</div></section>';
    return h;
  }

  function placePanel(p) {
    var h = '<header class="phead">';
    h += '<p class="status' + (p.live ? ' live' : '') + '"><i></i>' + esc(p.status) + '</p>';
    h += '<h2 class="company">' + (p.companyHref ? '<a href="' + p.companyHref + '" target="_blank" rel="noopener">' + esc(p.company) + '</a>' : esc(p.company)) + '</h2>';
    h += '<p class="role">' + esc(p.role) + '</p>';
    if (p.prev) h += '<p class="prev">' + esc(p.prev) + '</p>';
    h += '<p class="meta"><span>' + esc(p.period) + '</span><span>' + esc(p.where) + '</span></p>';
    if (p.intro) h += '<p class="intro">' + esc(p.intro) + '</p>';
    h += '</header>';

    if (p.headline && p.headline.length) {
      h += '<dl class="stats headline">' + p.headline.map(function (s) {
        return '<div class="stat"><dt>' + esc(s.l) + '</dt><dd>' + esc(s.n) + '</dd></div>';
      }).join('') + '</dl>';
    }
    if (p.projects) {
      h += '<section class="block"><h2 class="h">Проекты</h2><div class="projects">' + p.projects.map(function (x) {
        return '<article class="proj"><p class="pt">' + esc(x.t) + '</p><h3>' + esc(x.n) + '</h3><p class="pd">' + esc(x.d) + '</p>' +
          (x.href ? '<a class="link" href="' + x.href + '" target="_blank" rel="noopener">' + esc(x.site || x.href) + ext + '</a>' : '') + '</article>';
      }).join('') + '</div></section>';
    }
    if (p.cases && p.cases.length) {
      h += '<section class="block"><h2 class="h">Кейсы</h2><div class="cases">' + p.cases.map(function (c) {
        return '<article class="case"><div class="case-top"><p class="cn">' + c.num + ' · ' + esc(c.name) + '</p><p class="metric">' + esc(c.metric) + '</p></div>' +
          '<h3>' + esc(c.title) + '</h3><p class="cb">' + c.body + '</p>' +
          '<div class="tags">' + c.stack.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
          (c.link ? '<a class="link" href="' + c.link.href + '" target="_blank" rel="noopener">' + esc(c.link.label) + ext + '</a>' : '') + '</article>';
      }).join('') + '</div></section>';
    }
    if (p.duties && p.duties.length) {
      h += '<section class="block"><h2 class="h">Что делал</h2><ul class="list">' + p.duties.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul></section>';
    }
    if (p.results && p.results.length) {
      h += '<section class="block"><h2 class="h">' + esc(p.resultsLabel) + '</h2><ul class="list ok">' + p.results.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul></section>';
    }
    if (p.links && p.links.length) {
      h += '<section class="block"><h2 class="h">' + esc(p.linksTitle || 'Живые дашборды') + '</h2>' + (p.linksNote ? '<p class="intro" style="margin:-8px 0 18px">' + esc(p.linksNote) + '</p>' : '') + '<div class="links">' + p.links.map(function (l) {
        return '<a class="lk" href="' + l.href + '" target="_blank" rel="noopener"><span>' + esc(l.label) + '</span><b>' + esc(l.title) + '</b>' + ext + '</a>';
      }).join('') + '</div></section>';
    }
    return h;
  }

  var items = [{ id: 'about', tab: 'Обо мне', sub: 'Стек и условия', html: aboutPanel() }].concat(D.places.map(function (p) {
    return { id: p.id, tab: p.tab, sub: p.period.replace('по настоящее время', 'сейчас'), live: p.live, html: placePanel(p) };
  }));

  window.mountApp = function (opts) {
    var tabsEl = document.querySelector(opts.tabs), panelEl = document.querySelector(opts.panel);
    var btns = items.map(function (it, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.dataset.id = it.id;
      b.innerHTML = (opts.tabHtml ? opts.tabHtml(it, i) : '<span class="tl">' + esc(it.tab) + '</span>');
      b.addEventListener('click', function () { show(it.id, true); });
      tabsEl.appendChild(b);
      return b;
    });
    function show(id, push) {
      var idx = 0;
      items.forEach(function (it, i) { if (it.id === id) idx = i; });
      var it = items[idx];
      panelEl.innerHTML = it.html;
      panelEl.className = (panelEl.className.replace(/\bpanel-\S+/g, '') + ' panel-' + it.id).trim();
      btns.forEach(function (b, i) { b.setAttribute('aria-selected', i === idx ? 'true' : 'false'); });
      if (push) { try { history.replaceState(null, '', '#' + it.id); } catch (e) {} }
      if (opts.onShow) opts.onShow(it, idx, push);
      panelEl.classList.remove('enter'); void panelEl.offsetWidth; panelEl.classList.add('enter');
    }
    document.addEventListener('keydown', function (e) {
      if (e.target.closest && e.target.closest('a,input')) return;
      var cur = 0; btns.forEach(function (b, i) { if (b.getAttribute('aria-selected') === 'true') cur = i; });
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' && opts.vertical) { if (cur < items.length - 1) { show(items[cur + 1].id, true); btns[cur + 1].focus(); } }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' && opts.vertical) { if (cur > 0) { show(items[cur - 1].id, true); btns[cur - 1].focus(); } }
    });
    var h = location.hash.replace('#', '');
    show(items.some(function (i) { return i.id === h; }) ? h : 'about', false);
    return { show: show, items: items };
  };
})();
</script>
<script>
mountApp({tabs:'.tabs',panel:'#panel',vertical:true,
  tabHtml:function(it){return '<span class="tx"><span>'+it.tab+'</span><small>'+it.sub+'</small></span>'+(it.live?'<i class="dot"></i>':'');},
  onShow:function(it,i,push){var s=document.querySelector('.tab[aria-selected=true]');if(s&&s.scrollIntoView)s.scrollIntoView({inline:'center',block:'nearest'});if(push)window.scrollTo({top:0,behavior:'smooth'});}});
</script>
