<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитика колл-центра — демо</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>:root{--accent:#0b66c3;--navy:#10264a}.menu button[aria-selected=true]{background:#0b66c3}.btn.pri{background:#0b66c3;border-color:#0b66c3}.goal{display:inline-block;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:2px 9px;border-radius:999px;margin-top:4px}.stage{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;margin:3px 4px 3px 0;background:var(--card)}.stage.end{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}.stage.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.flow{margin:6px 0 16px}</style>
</head>
<body>
<script src="kit.js"></script>
<script>
K.shell({ brand: 'Колл-центр', sub: 'Аналитика Bitrix24 · демо', back: '../index.html#hoomie' });
function sec(id, t, s, body) { return { id: id, t: t, s: s, render: function (p) { body(p); } }; }
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
var cls = function (v, g, w) { return v >= g ? 'c-ok' : v >= w ? 'c-warn' : 'c-bad'; };

K.app({ sections: [
  sec('speed', 'Скорость ответа', 'Сколько секунд проходит от звонка до ответа оператора. Цель: до 10 секунд', function (p) {
    var lab = ['1 июл', '2 июл', '3 июл', '4 июл', '1–3 авг', '4–10 авг', '11–17 авг', '18–24 авг', '25–31 авг'], v = [10, 8.35, 8, 9.35, 9.9, 9.6, 10.4, 10.5, 19.7];
    p.innerHTML = K.kpis([{ l: 'Июль, среднее', v: '8,9 с', d: '<span class="goal">цель до 10 с</span>' }, { l: 'Август до 24 числа', v: '10,1 с', d: '<span class="delta flat">на границе цели</span>' }, { l: 'Последняя неделя августа', v: '19,7 с', d: '<span class="delta down">выше цели</span>' }, { l: 'Лучшая неделя', v: '8,0 с' }]) +
      '<div class="card"><h2>Ответ на звонок по неделям</h2><p class="note">Секунды. Зелёный в пределах цели, красный выше</p><div id="c"></div></div>' +
      '<div class="card" style="margin-top:14px"><h2>По операторам</h2><p class="note">Среднее по неделям июля, секунд</p><div class="scroll"><table><thead><tr><th>Неделя</th><th class="num">Оператор 1</th><th class="num">Оператор 2</th><th class="num">Среднее</th></tr></thead><tbody>' +
      [['1', 8, 12, 10], ['2', 8.2, 8.5, 8.35], ['3', 7.8, 8.2, 8], ['4', 8.9, 9.8, 9.35]].map(function (r) { return '<tr><td>' + r[0] + ' неделя июля</td><td class="num ' + (r[1] <= 10 ? 'c-ok' : 'c-warn') + '">' + K.fmt(r[1], 1) + '</td><td class="num ' + (r[2] <= 10 ? 'c-ok' : 'c-warn') + '">' + K.fmt(r[2], 1) + '</td><td class="num"><b>' + K.fmt(r[3], 1) + '</b></td></tr>'; }).join('') + '</tbody></table></div></div>';
    K.bars(document.getElementById('c'), lab, [{ name: 'Секунд', data: v, colors: v.map(function (x) { return x <= 10 ? '#15803d' : x <= 12 ? '#a15c00' : '#b42318'; }) }], { h: 230 });
  }),
  sec('calls', 'Звонки и чаты', 'Входящие обращения по проектам и каналам, пропущенные и перезвоны', function (p) {
    var wk = ['1 нед', '2 нед', '3 нед', '4 нед', '5 нед'], tot = [81, 104, 96, 114, 57], mis = [8, 12, 8, 13, 17], cb = [8, 12, 8, 13, 14];
    p.innerHTML = K.kpis([{ l: 'Звонки DIUS, июль', v: 371 }, { l: 'Пропущено', v: 50, d: '<span class="delta flat">13,5% от всех</span>' }, { l: 'Перезвонили за 5 минут', v: K.pct(47 / 50 * 100, 0), d: '<span class="goal">47 из 50</span>' }, { l: 'Чатов, июль', v: 95, d: '<span class="delta flat">DIUS, Forst, Hoomie</span>' }]) +
      '<div class="grid g2"><div class="card"><h2>Звонки DIUS по неделям июля</h2><p class="note">Принятые и пропущенные</p><div id="a"></div></div><div class="card"><h2>Звонки по проектам</h2><p class="note">Июль: всего, пропущено, перезвонили за 5 минут</p><div class="scroll"><table id="t"></table></div></div></div>' +
      '<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Чаты по каналам</h2><p class="note">Июль, обращений</p><div id="b"></div></div><div class="card"><h2>Август: пропущенные звонки DIUS</h2><p class="note">Перезвонили за 5 минут из пропущенных</p><div id="c"></div></div></div>';
    K.bars(document.getElementById('a'), wk, [{ name: 'Принятые', color: '#0b66c3', data: tot.map(function (x, i) { return x - mis[i]; }) }, { name: 'Пропущенные', color: '#b42318', data: mis }], { stack: true, h: 220 });
    document.getElementById('t').innerHTML = '<thead><tr><th>Проект</th><th class="num">Всего</th><th class="num">Пропущено</th><th class="num">Перезвон 5 мин</th></tr></thead><tbody>' + [['DIUS', 371, 50, 47], ['Forst', 93, 13, 13], ['Hoomie', 33, 5, 5]].map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td><td class="num ' + (r[3] === r[2] ? 'c-ok' : 'c-warn') + '">' + r[3] + '</td></tr>'; }).join('') + '</tbody>';
    K.hbars(document.getElementById('b'), [{ n: 'DIUS · ЦИАН', v: 25 }, { n: 'DIUS · WhatsApp', v: 15 }, { n: 'Forst · ЦИАН', v: 41 }, { n: 'Forst · Авито', v: 2 }, { n: 'Hoomie · ЦИАН', v: 5 }, { n: 'Hoomie · WhatsApp', v: 7 }]);
    K.bars(document.getElementById('c'), ['1–3', '4–10', '11–17', '18–24', '25–31'], [{ name: 'Пропущено', color: '#b42318', data: [3, 12, 19, 16, 23] }, { name: 'Перезвонили за 5 мин', color: '#15803d', data: [3, 10, 17, 12, 9] }], { h: 220 });
  }),
  sec('meet', 'Конверсия во встречу', 'Целевые клиенты, назначенные и проведённые встречи', function (p) {
    var f = [{ n: 'Целевые клиенты', v: 116 }, { n: 'Встреча назначена', v: 75 }, { n: 'Встреча проведена', v: 55, c: '#15803d' }];
    p.innerHTML = K.kpis([{ l: 'Целевых за 3 недели августа', v: 116 }, { l: 'Назначено встреч', v: 75, d: '<span class="delta flat">65% от целевых</span>' }, { l: 'Проведено встреч', v: 55, d: '<span class="goal">47% от целевых</span>' }, { l: 'Лучшая неделя', v: '59%', d: '<span class="delta flat">1–10 августа</span>' }]) +
      '<div class="grid g2"><div class="card"><h2>Воронка</h2><p class="note">Три недели августа</p><div id="f"></div></div><div class="card"><h2>По неделям</h2><p class="note">Конверсия целевых в проведённую встречу</p><div class="scroll"><table id="t"></table></div></div></div>' +
      '<div class="card" style="margin-top:14px"><h2>Начало работы: DIUS, первые дни июля</h2><p class="note">Лиды, запись на встречу и проведённые встречи</p><div class="scroll"><table><thead><tr><th>День</th><th class="num">Лидов</th><th class="num">Записаны</th><th class="num">Встреча проведена</th><th class="num">Конв. в запись</th></tr></thead><tbody>' + [['1 июля', 30, 11, 10], ['2 июля', 26, 8, 5]].map(function (r) { return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td><td class="num">' + r[3] + '</td><td class="num ' + cls(r[2] / r[1] * 100, 35, 25) + '">' + K.pct(r[2] / r[1] * 100, 0) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    K.funnel(document.getElementById('f'), f);
    document.getElementById('t').innerHTML = '<thead><tr><th>Неделя</th><th class="num">Целевых</th><th class="num">Назначено</th><th class="num">Проведено</th><th class="num">Конверсия</th></tr></thead><tbody>' + [['1–10 авг', 44, 29, 26], ['11–17 авг', 42, 25, 17], ['18–24 авг', 30, 21, 12]].map(function (r) { var c = r[3] / r[1] * 100; return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td><td class="num">' + r[3] + '</td><td class="num ' + cls(c, 45, 35) + '">' + K.pct(c, 0) + '</td></tr>'; }).join('') + '</tbody>';
  }),
  sec('quality', 'Качество разговоров', 'Проверка звонков по чек-листу и работа в CRM', function (p) {
    var crit = [['Приветствие и имя клиента', 100], ['Вежливый тон', 100], ['Подведение итогов', 98.5], ['Прощание по стандарту', 97.8], ['Уточнил данные для записи', 96.9], ['Приглашение на встречу без преимуществ', 94.4], ['Активное слушание', 91.9], ['Подстройка по темпу речи', 90.9], ['Консультация с преимуществами', 87.1], ['Держит диалог, задаёт вопросы', 82.4], ['Приглашение с преимуществами', 82.3], ['Отработка возражений', 47.1]];
    p.innerHTML = K.kpis([{ l: 'Проверено разговоров', v: 138, d: '<span class="delta flat">июль и август</span>' }, { l: 'Средний балл, июль', v: '92,2%' }, { l: 'Средний балл, август', v: '95,7%', d: K.deltaHtml(95.7, 92.2) }, { l: 'Слабое место', v: 'Возражения', d: '<span class="delta down">отработаны в 47%</span>' }]) +
      '<div class="grid g2"><div class="card"><h2>Пункты чек-листа</h2><p class="note">Доля разговоров, где пункт выполнен</p><div id="k"></div></div><div class="card"><h2>По операторам</h2><p class="note">Средний балл по чек-листу</p><div class="scroll"><table><thead><tr><th>Месяц</th><th class="num">Оператор 1</th><th class="num">Оператор 2</th></tr></thead><tbody><tr><td>Июль</td><td class="num c-ok">97,6%</td><td class="num c-warn">89,4%</td></tr><tr><td>Август</td><td class="num c-ok">96,3%</td><td class="num c-ok">95,3%</td></tr></tbody></table></div><h2 style="margin-top:18px">Работа в CRM</h2><p class="note">Доля обращений без ошибок: заполнение карточки, задачи, этапы</p><div class="scroll"><table><thead><tr><th>Месяц</th><th class="num">Оператор 1</th><th class="num">Оператор 2</th></tr></thead><tbody><tr><td>Июль</td><td class="num c-ok">91,8%</td><td class="num c-ok">91,4%</td></tr><tr><td>Август</td><td class="num c-ok">90%</td><td class="num c-ok">92%</td></tr><tr><td>Сентябрь</td><td class="num c-ok">97%</td><td class="num c-ok">97%</td></tr></tbody></table></div></div></div>';
    K.hbars(document.getElementById('k'), crit.map(function (x) { return { n: x[0], v: x[1], c: x[1] < 85 ? '#b42318' : undefined }; }), { fmt: function (v) { return K.fmt(v, 1) + '%'; } });
    document.querySelectorAll('#k .bar-row').forEach(function (e) { e.style.gridTemplateColumns = 'minmax(120px,210px) 1fr 52px'; });
  }),
  sec('ops', 'Операторы и KPI', 'Встречи, качество и работа в CRM по месяцам', function (p) {
    var m = ['Июль', 'Август', 'Сентябрь'], a = [29, 43, 68], b = [17, 25, 40];
    p.innerHTML = K.kpis([{ l: 'Встреч, июль', v: sum([29, 17]) }, { l: 'Встреч, август', v: sum([43, 25]), d: K.deltaHtml(68, 46) }, { l: 'Встреч, сентябрь', v: sum([68, 40]), d: K.deltaHtml(108, 68) }, { l: 'Рост за 3 месяца', v: '×2,3' }]) +
      '<div class="grid g2"><div class="card"><h2>Клиенты, доведённые до встречи</h2><p class="note">По месяцам, на каждого оператора</p><div id="c"></div></div><div class="card"><h2>Показатели месяца</h2><p class="note">Качество диалогов и работа в CRM, %</p><div class="scroll"><table><thead><tr><th>Месяц</th><th class="num">Оп. 1 диалоги</th><th class="num">Оп. 2 диалоги</th><th class="num">Оп. 1 CRM</th><th class="num">Оп. 2 CRM</th></tr></thead><tbody><tr><td>Июль</td><td class="num">97</td><td class="num">89</td><td class="num">92</td><td class="num">91</td></tr><tr><td>Август</td><td class="num">96</td><td class="num">95</td><td class="num">90</td><td class="num">92</td></tr><tr><td>Сентябрь</td><td class="num">90</td><td class="num">92</td><td class="num">97</td><td class="num">97</td></tr></tbody></table></div></div></div>' +
      '<div class="card" style="margin-top:14px"><h2>Мотивация</h2><p class="note">Оклад плюс бонус за подтверждённую встречу: 700 ₽ умножить на коэффициент. Плановая нагрузка около 28 встреч на оператора в месяц</p><div class="scroll"><table><thead><tr><th>Показатель</th><th>Диапазон</th><th class="num">Коэффициент</th></tr></thead><tbody><tr><td rowspan="1"><b>Эффективность работы в CRM</b></td><td>выше 95%</td><td class="num c-ok">1,3</td></tr><tr><td></td><td>90–95%</td><td class="num c-ok">1,0</td></tr><tr><td></td><td>85–90%</td><td class="num c-warn">0,8</td></tr><tr><td></td><td>ниже 80%</td><td class="num c-bad">0</td></tr><tr><td><b>Качество диалогов</b></td><td>90% и выше</td><td class="num c-ok">1,3</td></tr><tr><td></td><td>80–90%</td><td class="num c-ok">1,0</td></tr><tr><td></td><td>ниже 70%</td><td class="num c-bad">0</td></tr></tbody></table></div></div>';
    K.bars(document.getElementById('c'), m, [{ name: 'Оператор 1', color: '#0b66c3', data: a }, { name: 'Оператор 2', color: '#c9a96e', data: b }], { h: 220 });
  }),
  sec('load', 'Загрузка отдела', 'Сколько звонков и минут в месяц нужно закрывать операторам', function (p) {
    var rows = [['DIUS', 449, 2029], ['Forst', 245, 1257], ['Hoomie', 140, 714]];
    p.innerHTML = K.kpis([{ l: 'Звонков в месяц', v: K.fmt(1404) }, { l: 'Минут разговоров', v: K.fmt(4407) }, { l: 'Часов в месяц', v: '73' }, { l: 'Звонков в будний день', v: '60', d: '<span class="delta flat">в выходной 18</span>' }]) +
      '<div class="grid g2"><div class="card"><h2>Минуты по проектам</h2><p class="note">Расчёт нагрузки: целевые 6 минут, нецелевые 3 минуты, запись на встречу 7 минут</p><div id="a"></div></div><div class="card"><h2>План воронки</h2><p class="note">Целевые клиенты, встречи 18%, сделки 6%</p><div class="scroll"><table><thead><tr><th>Проект</th><th class="num">Целевых</th><th class="num">Встреч</th><th class="num">Сделок</th></tr></thead><tbody><tr><td>DIUS</td><td class="num">120</td><td class="num">21,6</td><td class="num">7,2</td></tr><tr><td>Hoomie</td><td class="num">145</td><td class="num">26,1</td><td class="num">8,7</td></tr><tr><td>Hoomie, постпродажа</td><td class="num">43,5</td><td class="num">7,8</td><td class="num">2,6</td></tr><tr><td><b>Итого</b></td><td class="num"><b>308,5</b></td><td class="num"><b>55,5</b></td><td class="num"><b>18,5</b></td></tr></tbody></table></div></div></div>';
    K.hbars(document.getElementById('a'), rows.map(function (r) { return { n: r[0] + ' · ' + r[1] + ' зв.', v: r[2] }; }), { fmt: function (v) { return K.fmt(v) + ' мин'; } });
    document.querySelectorAll('#a .bar-row').forEach(function (e) { e.style.gridTemplateColumns = 'minmax(110px,170px) 1fr 70px'; });
  }),
  sec('demand', 'Спрос', 'Какими объектами интересуются клиенты', function (p) {
    var w = ['Июль', '1–3 авг', '4–10 авг', '11–17 авг', '18–24 авг', '25–31 авг'];
    p.innerHTML = '<div class="grid g2"><div class="card"><h2>Объекты интереса</h2><p class="note">Целевые обращения по типам</p><div id="a"></div></div><div class="card"><h2>Июль в цифрах</h2><p class="note">&nbsp;</p><div id="b"></div></div></div>';
    K.bars(document.getElementById('a'), w, [{ name: 'Апартаменты', color: '#0b66c3', data: [135, 13, 20, 27, 23, 31] }, { name: 'Офисы', color: '#c9a96e', data: [12, 1, 4, 3, 3, 0] }, { name: 'Ритейл', color: '#15803d', data: [11, 0, 3, 2, 3, 1] }, { name: 'Машиноместа', color: '#8d96a8', data: [2, 0, 0, 0, 1, 0] }], { stack: true, h: 240 });
    K.hbars(document.getElementById('b'), [{ n: 'Апартаменты', v: 135 }, { n: 'Офисы', v: 12 }, { n: 'Ритейл', v: 11 }, { n: 'Машиноместа', v: 2 }]);
  }),
  sec('funnels', 'Воронки', 'Этапы в Bitrix24, которые я настроил', function (p) {
    function flow(arr) { return '<div class="flow">' + arr.map(function (s) { return '<span class="stage' + (s.indexOf('Успешно') === 0 ? ' end' : (s.indexOf('Дисквал') === 0 || s.indexOf('Отказ') === 0 ? ' bad' : '')) + '">' + s + '</span>'; }).join('') + '</div>'; }
    p.innerHTML = '<div class="card"><h2>Новостройки DIUS</h2>' + flow(['Новая заявка', 'В работе', 'Встреча назначена', 'Встреча проведена', 'Бесплатная бронь', 'Платная бронь', 'Формирование ДДУ', 'Регистрация договора', 'Договор зарегистрирован', 'Успешно реализовано', 'Отложенный спрос', 'Дисквалификация']) + '</div>' +
      '<div class="card" style="margin-top:14px"><h2>Новостройки Forst</h2>' + flow(['Новая заявка', 'Брокерские заявки', 'В работе', 'Встреча назначена', 'Встреча проведена', 'Бесплатная бронь', 'Платная бронь', 'Формирование договора', 'Регистрация договора', 'Успешно реализовано', 'Отложенный спрос', 'Дисквалификация']) + '</div>' +
      '<div class="card" style="margin-top:14px"><h2>Hoomie: продажа квартиры клиента</h2>' + flow(['Интерес в боте', 'Звонок или заявка', 'В работе колл-центра', 'Встреча на объекте', 'Первичная оценка', 'Подготовка материалов', 'Согласование и оплата', 'Публикация размещена', 'Переговоры', 'Принят аванс', 'Сделка', 'Успешно реализовано', 'Дисквалификация']) + '<p class="note" style="max-width:none">Колл-центр создаёт заявку, выездной менеджер приезжает с фотографом, дальше сделка идёт по этапам с автоматическими задачами и сообщениями клиенту.</p></div>' +
      '<div class="card" style="margin-top:14px"><h2>Hoomie: постпродажа, покупатели</h2>' + flow(['Новые клиенты', 'В работе', 'Контакт покупателя передан', 'Назначена встреча', 'Просмотр проведён', 'Оффер отправлен', 'Согласование с собственником', 'Оффер согласован', 'Юридическое сопровождение', 'Успешно реализовано', 'Дисквалификация']) + '</div>';
  })
] });
</script>
</body>
</html>
