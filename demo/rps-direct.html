<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Директ — демо</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<link rel="stylesheet" href="rps.css">
<style>:root{--accent:#ffc940}.btn.pri,.seg button[aria-pressed=true],.menu button[aria-selected=true]{background:#ffc940;color:#1a1400}.badge-demo{background:var(--warn-bg)}</style>
</head>
<body>
<script src="kit.js"></script>
<script>
K.shell({ brand: 'Директ', sub: 'Реклама по кампусам · демо', back: '../index.html#playschool' });
var camps = ['Кампус Север', 'Кампус Юг', 'Кампус Восток', 'Кампус Запад'], R = K.rng(606), data = camps.map(function (n, i) { var spend = Math.round(180000 + R() * 120000), clicks = Math.round(spend / (38 + R() * 20)), shows = Math.round(clicks * (24 + R() * 14)), leads = Math.round(clicks * (.03 + R() * .03)), plan = Math.round(spend * (.9 + R() * .25)); return { n: n, spend: spend, clicks: clicks, shows: shows, leads: leads, plan: plan }; });
function rub(v) { return K.fmt(v) + ' ₽'; }
var T = { spend: 0, clicks: 0, shows: 0, leads: 0, plan: 0 }; data.forEach(function (d) { for (var k in T) T[k] += d[k]; });

K.app({ sections: [
  { id: 'over', t: 'Обзор', s: 'Расход, клики и заявки за месяц', render: function (p) {
    var lab = [], sp = [], ld = [], R2 = K.rng(3);
    for (var i = 0; i < 30; i++) { lab.push(('0' + (i + 1)).slice(-2)); sp.push(Math.round(T.spend / 30 * (.8 + R2() * .4))); ld.push(Math.round(T.leads / 30 * (.7 + R2() * .6))); }
    p.innerHTML = K.kpis([{ l: 'Расход', v: rub(T.spend), d: K.deltaHtml(T.spend, T.spend * .92, false) }, { l: 'Показы', v: K.fmt(T.shows) }, { l: 'Клики', v: K.fmt(T.clicks), d: K.deltaHtml(T.clicks, T.clicks * .95) }, { l: 'CTR', v: K.pct(T.clicks / T.shows * 100, 2) }, { l: 'Цена клика', v: K.fmt(T.spend / T.clicks, 0) + ' ₽' }, { l: 'Заявки', v: K.fmt(T.leads), d: K.deltaHtml(T.leads, T.leads * .9) }, { l: 'Цена заявки', v: rub(T.spend / T.leads), d: K.deltaHtml(T.spend / T.leads, T.spend / T.leads * 1.04, false) }, { l: 'План расхода', v: K.pct(T.spend / T.plan * 100, 0) }]) + '<div class="grid g2"><div class="card"><h2>Расход по дням</h2><p class="note">₽</p><div id="a"></div></div><div class="card"><h2>Заявки по дням</h2><p class="note">&nbsp;</p><div id="b"></div></div></div>';
    K.bars(document.getElementById('a'), lab, [{ name: 'Расход', color: '#ffc940', data: sp }], { h: 210 });
    K.line(document.getElementById('b'), lab, [{ name: 'Заявки', color: '#e45f36', data: ld }], { h: 210, area: true });
  } },
  { id: 'camp', t: 'Сводная по кампусам', s: 'Показатели каждого кампуса рядом', render: function (p) {
    p.innerHTML = '<div class="card"><h2>Кампусы</h2><p class="note">Цена заявки: зелёный до 3 500 ₽, красный дороже 5 500 ₽</p><div class="scroll"><table><thead><tr><th>Кампус</th><th class="num">Расход</th><th class="num">Показы</th><th class="num">Клики</th><th class="num">CTR</th><th class="num">Цена клика</th><th class="num">Заявки</th><th class="num">Цена заявки</th></tr></thead><tbody>' + data.map(function (d) { var cpl = d.spend / d.leads; return '<tr><td><b>' + d.n + '</b></td><td class="num">' + rub(d.spend) + '</td><td class="num">' + K.fmt(d.shows) + '</td><td class="num">' + K.fmt(d.clicks) + '</td><td class="num">' + K.pct(d.clicks / d.shows * 100, 2) + '</td><td class="num">' + K.fmt(d.spend / d.clicks) + ' ₽</td><td class="num">' + d.leads + '</td><td class="num ' + (cpl < 3500 ? 'c-ok' : cpl < 5500 ? 'c-warn' : 'c-bad') + '">' + rub(cpl) + '</td></tr>'; }).join('') + '<tr><td><b>Итого</b></td><td class="num"><b>' + rub(T.spend) + '</b></td><td class="num"><b>' + K.fmt(T.shows) + '</b></td><td class="num"><b>' + K.fmt(T.clicks) + '</b></td><td class="num"></td><td class="num"></td><td class="num"><b>' + T.leads + '</b></td><td class="num"><b>' + rub(T.spend / T.leads) + '</b></td></tr></tbody></table></div></div>';
  } },
  { id: 'week', t: 'Понедельный отчёт', s: 'Динамика по неделям', render: function (p) {
    var R2 = K.rng(77), rows = []; for (var i = 7; i >= 0; i--) { var sp = Math.round(T.spend / 4.3 * (.8 + R2() * .4)), cl = Math.round(sp / (40 + R2() * 14)), ld = Math.round(cl * (.03 + R2() * .03)); rows.push({ w: '−' + i + ' нед', sp: sp, cl: cl, ld: ld }); }
    p.innerHTML = '<div class="card"><h2>Недели</h2><p class="note">&nbsp;</p><div id="c"></div></div><div class="card" style="margin-top:14px"><div class="scroll"><table><thead><tr><th>Неделя</th><th class="num">Расход</th><th class="num">Клики</th><th class="num">Заявки</th><th class="num">Цена заявки</th></tr></thead><tbody>' + rows.slice().reverse().map(function (r) { return '<tr><td>' + r.w + '</td><td class="num">' + rub(r.sp) + '</td><td class="num">' + r.cl + '</td><td class="num">' + r.ld + '</td><td class="num">' + rub(r.sp / r.ld) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    K.bars(document.getElementById('c'), rows.map(function (r) { return r.w; }), [{ name: 'Расход', color: '#ffc940', data: rows.map(function (r) { return r.sp; }) }, { name: 'Заявки ×1000', color: '#e45f36', data: rows.map(function (r) { return r.ld * 1000; }) }], { h: 220 });
  } },
  { id: 'plan', t: 'План и факт', s: 'Расход по кампусам против плана', render: function (p) {
    p.innerHTML = '<div class="card"><h2>Выполнение плана</h2><p class="note">План редактирует маркетолог после входа. Здесь демо без редактирования</p><div id="a"></div></div>';
    document.getElementById('a').innerHTML = data.map(function (d) { var pc = d.spend / d.plan * 100; return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><b>' + d.n + '</b><span>' + rub(d.spend) + ' из ' + rub(d.plan) + ' · ' + K.fmt(pc, 0) + '%</span></div><div style="background:var(--track);border-radius:7px;height:16px;overflow:hidden"><div style="height:100%;width:' + Math.min(100, pc) + '%;background:' + (pc > 100 ? '#f87171' : '#ffc940') + ';border-radius:7px"></div></div></div>'; }).join('');
  } },
  { id: 'chan', t: 'По каналам', s: 'Поиск, сети и ретаргетинг', render: function (p) {
    var ch = [['Поиск', .52], ['Рекламная сеть', .24], ['Ретаргетинг', .14], ['Карты', .1]];
    p.innerHTML = '<div class="grid g2"><div class="card"><h2>Расход по каналам</h2><p class="note">Доля</p><div id="a"></div></div><div class="card"><h2>Цена заявки по каналам</h2><p class="note">₽</p><div id="b"></div></div></div>';
    K.hbars(document.getElementById('a'), ch.map(function (c) { return { n: c[0], v: Math.round(T.spend * c[1]) }; }), { fmt: rub });
    K.hbars(document.getElementById('b'), ch.map(function (c, i) { return { n: c[0], v: Math.round(T.spend / T.leads * [.85, 1.3, .7, .6][i]) }; }), { fmt: rub });
    document.querySelectorAll('.bar-row').forEach(function (e) { e.style.gridTemplateColumns = 'minmax(90px,150px) 1fr 100px'; });
  } }
] });
</script>
</body>
</html>
